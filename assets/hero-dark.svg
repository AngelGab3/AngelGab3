<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="100%" role="img" aria-label="Ángel Gabriel Munguía Velázquez — Computational Physics &amp; Quantum Computing">
  <defs>
    <pattern id="grid-dark" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="rgba(167, 139, 250, 0.065)" stroke-width="1"/>
    </pattern>
    <linearGradient id="accent-dark" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="48%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <radialGradient id="glowL-dark" cx="24%" cy="30%" r="48%">
      <stop offset="0%" stop-color="rgba(139, 92, 246, 0.16)"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
    <radialGradient id="glowR-dark" cx="82%" cy="50%" r="36%">
      <stop offset="0%" stop-color="rgba(34, 211, 238, 0.16)"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
    <radialGradient id="sphereGrad-dark" cx="38%" cy="30%" r="68%">
      <stop offset="0%" stop-color="rgba(139, 92, 246, 0.14)"/>
      <stop offset="100%" stop-color="rgba(34, 211, 238, 0.04)"/>
    </radialGradient>
    <clipPath id="clip-dark">
      <rect x="1" y="1" width="1198" height="338" rx="18"/>
    </clipPath>
  </defs>

  <style>
    .sans { font-family: 'Space Grotesk', 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif; }
    .mono { font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .math { font-family: 'STIX Two Math', 'Cambria Math', 'Times New Roman', Georgia, serif; }
    @keyframes railFlow {
      0% { stroke-dashoffset: 620; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes orbitSpin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes blochPrecess {
      0%, 100% { transform: rotate(-22deg); }
      50% { transform: rotate(22deg); }
    }
    @keyframes gateGlow {
      0%, 100% { opacity: 0.78; }
      50% { opacity: 1; }
    }
    .flow-0 {
      stroke-dasharray: 44 266;
      animation: railFlow 3.4s linear infinite;
    }
    .flow-1 {
      stroke-dasharray: 44 266;
      animation: railFlow 3.4s linear -1.1s infinite;
    }
    .flow-2 {
      stroke-dasharray: 44 266;
      animation: railFlow 3.4s linear -2.2s infinite;
    }
    .orbit-ring {
      transform-origin: 985px 162px;
      animation: orbitSpin 36s linear infinite;
    }
    .bloch-vec {
      transform-origin: 985px 162px;
      animation: blochPrecess 5.8s ease-in-out infinite;
    }
    .gate-pulse {
      animation: gateGlow 3.4s ease-in-out infinite;
    }
  </style>

  <g clip-path="url(#clip-dark)">
    <!-- Base canvas & atmospheric lighting -->
    <rect x="0" y="0" width="1200" height="340" fill="#07070e"/>
    <rect x="0" y="0" width="1200" height="340" fill="url(#grid-dark)"/>
    <rect x="0" y="0" width="1200" height="340" fill="url(#glowL-dark)"/>
    <rect x="0" y="0" width="1200" height="340" fill="url(#glowR-dark)"/>

    <!-- Main Hero Heading (clean, no lab badge) -->
    <text x="48" y="74" class="sans" font-size="36" font-weight="700" fill="url(#accent-dark)" letter-spacing="-0.6">Ángel Gabriel Munguía Velázquez</text>
    <text x="48" y="106" class="sans" font-size="15.5" font-weight="500" fill="#9ca3b8">Computational Physics  ·  Quantum Computing  ·  Information Geometry  ·  Deep Learning</text>

    <!-- 3-Qubit Quantum Circuit Panel -->
    <rect x="48" y="136" width="690" height="146" rx="14" fill="#0d0d1a" fill-opacity="0.78" stroke="#272344" stroke-width="1"/>

    <!-- Qubit labels -->
    <text x="64" y="178" class="mono" font-size="12.5" font-weight="600" fill="#a78bfa">q<tspan baseline-shift="sub" font-size="72%">0</tspan> |0⟩</text>
    <text x="64" y="214" class="mono" font-size="12.5" font-weight="600" fill="#a78bfa">q<tspan baseline-shift="sub" font-size="72%">1</tspan> |0⟩</text>
    <text x="64" y="250" class="mono" font-size="12.5" font-weight="600" fill="#a78bfa">q<tspan baseline-shift="sub" font-size="72%">2</tspan> |0⟩</text>

    <!-- Classical readout label -->
    <text x="706" y="214" class="mono" font-size="12" font-weight="600" fill="#7c849d">c<tspan baseline-shift="sub" font-size="72%">3</tspan></text>

    <!-- Static horizontal qubit rails -->
    <line x1="118" y1="174" x2="660" y2="174" stroke="#2e294e" stroke-width="1.6"/>
    <line x1="118" y1="210" x2="660" y2="210" stroke="#2e294e" stroke-width="1.6"/>
    <line x1="118" y1="246" x2="660" y2="246" stroke="#2e294e" stroke-width="1.6"/>

    <!-- Classical double wire outputs -->
    
    <line x1="660" y1="172" x2="696" y2="172" stroke="#2e294e" stroke-width="1.2"/>
    <line x1="660" y1="176" x2="696" y2="176" stroke="#2e294e" stroke-width="1.2"/>
    <line x1="660" y1="208" x2="696" y2="208" stroke="#2e294e" stroke-width="1.2"/>
    <line x1="660" y1="212" x2="696" y2="212" stroke="#2e294e" stroke-width="1.2"/>
    <line x1="660" y1="244" x2="696" y2="244" stroke="#2e294e" stroke-width="1.2"/>
    <line x1="660" y1="248" x2="696" y2="248" stroke="#2e294e" stroke-width="1.2"/>

    <!-- Animated quantum phase pulses along rails -->
    <line class="flow-0" x1="118" y1="174" x2="660" y2="174" stroke="#22d3ee" stroke-width="2.4" stroke-linecap="round"/>
    <line class="flow-1" x1="118" y1="210" x2="660" y2="210" stroke="#a78bfa" stroke-width="2.4" stroke-linecap="round"/>
    <line class="flow-2" x1="118" y1="246" x2="660" y2="246" stroke="#22d3ee" stroke-width="2.4" stroke-linecap="round"/>

    <!-- Column 1: H, Ry(θ), H -->
    <g class="gate-pulse">
      <rect x="148" y="159" width="32" height="30" rx="6" fill="#131326" stroke="#a78bfa" stroke-width="1.4"/>
      <text x="164" y="178" class="mono" font-size="13" font-weight="700" fill="#e8e9f3" text-anchor="middle">H</text>

      <rect x="138" y="195" width="52" height="30" rx="6" fill="#131326" stroke="#22d3ee" stroke-width="1.4"/>
      <text x="164" y="214" class="mono" font-size="11.5" font-weight="700" fill="#e8e9f3" text-anchor="middle">R<tspan baseline-shift="sub" font-size="72%">y</tspan>(θ)</text>

      <rect x="148" y="231" width="32" height="30" rx="6" fill="#131326" stroke="#a78bfa" stroke-width="1.4"/>
      <text x="164" y="250" class="mono" font-size="13" font-weight="700" fill="#e8e9f3" text-anchor="middle">H</text>
    </g>

    <!-- Column 2: CNOT q0 -> q1 -->
    <line x1="252" y1="174" x2="252" y2="220" stroke="#22d3ee" stroke-width="1.8"/>
    <circle cx="252" cy="174" r="5" fill="#22d3ee"/>
    <circle cx="252" cy="210" r="10.5" fill="#131326" stroke="#22d3ee" stroke-width="1.7"/>
    <line x1="245" y1="210" x2="259" y2="210" stroke="#22d3ee" stroke-width="1.6"/>
    <line x1="252" y1="203" x2="252" y2="217" stroke="#22d3ee" stroke-width="1.6"/>

    <!-- Column 3: CNOT q1 -> q2 -->
    <line x1="336" y1="210" x2="336" y2="256" stroke="#a78bfa" stroke-width="1.8"/>
    <circle cx="336" cy="210" r="5" fill="#a78bfa"/>
    <circle cx="336" cy="246" r="10.5" fill="#131326" stroke="#a78bfa" stroke-width="1.7"/>
    <line x1="329" y1="246" x2="343" y2="246" stroke="#a78bfa" stroke-width="1.6"/>
    <line x1="336" y1="239" x2="336" y2="253" stroke="#a78bfa" stroke-width="1.6"/>

    <!-- Column 4: Rz(φ), X, Ry(α) -->
    <rect x="398" y="159" width="52" height="30" rx="6" fill="#131326" stroke="#22d3ee" stroke-width="1.4"/>
    <text x="424" y="178" class="mono" font-size="11.5" font-weight="700" fill="#e8e9f3" text-anchor="middle">R<tspan baseline-shift="sub" font-size="72%">z</tspan>(φ)</text>

    <rect x="408" y="195" width="32" height="30" rx="6" fill="#131326" stroke="#a78bfa" stroke-width="1.4"/>
    <text x="424" y="214" class="mono" font-size="13" font-weight="700" fill="#e8e9f3" text-anchor="middle">X</text>

    <rect x="398" y="231" width="52" height="30" rx="6" fill="#131326" stroke="#22d3ee" stroke-width="1.4"/>
    <text x="424" y="250" class="mono" font-size="11.5" font-weight="700" fill="#e8e9f3" text-anchor="middle">R<tspan baseline-shift="sub" font-size="72%">y</tspan>(α)</text>

    <!-- Column 5: CZ q0 <-> q2 + H on q1 -->
    <line x1="528" y1="174" x2="528" y2="246" stroke="#22d3ee" stroke-width="1.6" stroke-dasharray="4 3"/>
    <circle cx="528" cy="174" r="5" fill="#22d3ee"/>
    <circle cx="528" cy="246" r="5" fill="#22d3ee"/>
    <rect x="512" y="195" width="32" height="30" rx="6" fill="#131326" stroke="#a78bfa" stroke-width="1.4"/>
    <text x="528" y="214" class="mono" font-size="13" font-weight="700" fill="#e8e9f3" text-anchor="middle">H</text>

    <!-- Column 6: Measurement meters -->
    
    <g>
      <rect x="614" y="160" width="32" height="28" rx="6" fill="#131326" stroke="#4c3f82" stroke-width="1.4"/>
      <path d="M 621 180 A 9 9 0 0 1 639 180" fill="none" stroke="#22d3ee" stroke-width="1.4"/>
      <line x1="630" y1="180" x2="637" y2="169" stroke="#a78bfa" stroke-width="1.6" stroke-linecap="round"/>
      <circle cx="630" cy="180" r="1.6" fill="#e8e9f3"/>
    </g>
    <g>
      <rect x="614" y="196" width="32" height="28" rx="6" fill="#131326" stroke="#4c3f82" stroke-width="1.4"/>
      <path d="M 621 216 A 9 9 0 0 1 639 216" fill="none" stroke="#22d3ee" stroke-width="1.4"/>
      <line x1="630" y1="216" x2="637" y2="205" stroke="#a78bfa" stroke-width="1.6" stroke-linecap="round"/>
      <circle cx="630" cy="216" r="1.6" fill="#e8e9f3"/>
    </g>
    <g>
      <rect x="614" y="232" width="32" height="28" rx="6" fill="#131326" stroke="#4c3f82" stroke-width="1.4"/>
      <path d="M 621 252 A 9 9 0 0 1 639 252" fill="none" stroke="#22d3ee" stroke-width="1.4"/>
      <line x1="630" y1="252" x2="637" y2="241" stroke="#a78bfa" stroke-width="1.6" stroke-linecap="round"/>
      <circle cx="630" cy="252" r="1.6" fill="#e8e9f3"/>
    </g>

    <!-- Typeset Equation strip (clean Unicode/tspan super-subscripts) -->
    <text x="48" y="314" class="math" font-size="14.5" fill="#7c849d">|ψ⟩ = cos(θ/2)|0⟩ + <tspan font-style="italic">e</tspan><tspan baseline-shift="super" font-size="72%"><tspan font-style="italic">i</tspan>φ</tspan> sin(θ/2)|1⟩   ·   <tspan font-style="italic">ds</tspan><tspan baseline-shift="super" font-size="72%">2</tspan> = <tspan font-style="italic">g</tspan><tspan baseline-shift="sub" font-size="72%">ij</tspan> <tspan font-style="italic">dθ</tspan><tspan baseline-shift="super" font-size="72%">i</tspan> <tspan font-style="italic">dθ</tspan><tspan baseline-shift="super" font-size="72%">j</tspan>   ·   <tspan font-style="italic">U</tspan>(<tspan font-style="italic">t</tspan>) = <tspan font-style="italic">e</tspan><tspan baseline-shift="super" font-size="72%">−<tspan font-style="italic">iHt</tspan>/ℏ</tspan></text>

    <!-- Right: 3D Bloch Sphere -->
    <g>
      <circle class="orbit-ring" cx="985" cy="162" r="124" fill="none" stroke="#272344" stroke-width="1.1" stroke-dasharray="4 7"/>
      <circle cx="985" cy="162" r="100" fill="url(#sphereGrad-dark)" stroke="#a78bfa" stroke-opacity="0.45" stroke-width="1.4"/>

      <!-- Equatorial plane (back dashed + front solid) -->
      <path d="M 885 162 A 100 29 0 0 1 1085 162" fill="none" stroke="#22d3ee" stroke-opacity="0.28" stroke-width="1.2" stroke-dasharray="4 4"/>
      <path d="M 885 162 A 100 29 0 0 0 1085 162" fill="none" stroke="#22d3ee" stroke-opacity="0.72" stroke-width="1.5"/>

      <!-- Vertical meridian -->
      <ellipse cx="985" cy="162" rx="33" ry="100" fill="none" stroke="#a78bfa" stroke-opacity="0.26" stroke-width="1.1"/>

      <!-- Coordinate axes -->
      <line x1="985" y1="53" x2="985" y2="271" stroke="#7c849d" stroke-opacity="0.45" stroke-width="1" stroke-dasharray="3 3"/>
      <line x1="878" y1="162" x2="1092" y2="162" stroke="#7c849d" stroke-opacity="0.4" stroke-width="1" stroke-dasharray="3 3"/>
      <line x1="925" y1="201" x2="1045" y2="123" stroke="#7c849d" stroke-opacity="0.35" stroke-width="1" stroke-dasharray="3 3"/>

      <!-- Pole labels -->
      <text x="985" y="43" class="mono" font-size="13" font-weight="600" fill="#e8e9f3" text-anchor="middle">|0⟩</text>
      <text x="985" y="288" class="mono" font-size="13" font-weight="600" fill="#e8e9f3" text-anchor="middle">|1⟩</text>
      <text x="1100" y="166" class="mono" font-size="12.5" font-weight="600" fill="#22d3ee">|+⟩</text>
      <text x="870" y="166" class="mono" font-size="12.5" font-weight="600" fill="#7c849d" text-anchor="end">|-⟩</text>
      <text x="1050" y="120" class="mono" font-size="12" font-weight="600" fill="#a78bfa">|i⟩</text>

      <!-- Precessing Quantum State Vector |ψ⟩ -->
      <g class="bloch-vec">
        <line x1="985" y1="162" x2="1029" y2="90" stroke="url(#accent-dark)" stroke-width="3" stroke-linecap="round"/>
        <circle cx="1029" cy="90" r="10" fill="#22d3ee" fill-opacity="0.22"/>
        <circle cx="1029" cy="90" r="4.8" fill="#22d3ee"/>
        <text x="1043" y="86" class="mono" font-size="13" font-weight="700" fill="#22d3ee">|ψ⟩</text>
      </g>

      <circle cx="985" cy="162" r="3" fill="#e8e9f3" fill-opacity="0.8"/>
      <text x="985" y="314" class="mono" font-size="11.5" fill="#7c849d" text-anchor="middle">QUBIT STATE · ⟨Z⟩ = cos θ</text>
    </g>
  </g>

  <rect x="1" y="1" width="1198" height="338" rx="18" fill="none" stroke="#272344" stroke-width="1.5"/>
</svg>
